name: Windows build and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build solution
        run: dotnet build ExcelSticker.sln --configuration Release
      - name: Core regression checks
        run: dotnet run --project tests/ExcelSticker.Core.Tests --configuration Release --no-build
      - name: WPF layout and batch smoke checks
        run: dotnet run --project tests/ExcelSticker.Wpf.Tests --configuration Release --no-build
      - name: Publish Windows x64 application
        run: dotnet publish src/ExcelSticker.Wpf --configuration Release --runtime win-x64 --self-contained true --output artifacts/OceanGlass-LabelMaker
      - uses: actions/upload-artifact@v4
        with:
          name: OceanGlass-LabelMaker-win-x64
          path: artifacts/OceanGlass-LabelMaker/
          if-no-files-found: error
